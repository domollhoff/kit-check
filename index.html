<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffeec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kit Check">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Kit Check</title>

<!--
  Kit Check. See SPEC.md.
  Build 4: full surface rebuild on Dom's references (Airbnb layout and air,
  Strava colour/weight/motion, Fitness rings for packing) plus Phase 2:
  gigs and the pack screen.

  Conventions:
  - Bump BUILD in index.html AND sw.js on every deploy.
  - Schema changes: append to DB.migrations, raise DB_VERSION by one.
  - Every colour is a token in :root. Never define one only inside a media
    query or [data-theme] block.
  - The hero blob on Home grows with the inventory. Rings own the pack screen.
  - Never await between creating an IndexedDB transaction and using it.
-->

<style>
@font-face{font-family:"Jakarta";src:url(fonts/jakarta-var.woff2) format("woff2-variations"),url(fonts/jakarta-var.woff2) format("woff2");font-weight:200 800;font-display:swap;}

:root{
  --bg:#fffeec;
  --card:#ffffff;
  --well:#f3f1e0;
  --well-2:#e8e5cf;
  --ink:#222222;
  --ink-2:#5f5e52;
  --ink-3:#9a9889;
  --hair:#ecead8;
  --accent:#cac426;
  --accent-ink:#222222;
  --accent-tint:#f4f1cb;
  --accent-deep:#8a8512;
  --blob-a:#cac426;
  --blob-b:#f2b233;
  --blob-c:#ff7a45;
  --red:#ff3b30;
  --green:#22c55e;
  --track:#ecead9;
  --scrim:rgba(34,34,34,.42);
  --sh-1:0 1px 2px rgba(34,34,34,.05),0 6px 20px rgba(34,34,34,.07);
  --sh-2:0 2px 4px rgba(34,34,34,.06),0 14px 40px rgba(34,34,34,.11);
  --sh-up:0 -8px 40px rgba(34,34,34,.16);
  --font:"Jakarta",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --r:22px;
  --r-sm:16px;
  --tap:48px;
  --row:60px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
  --out:cubic-bezier(.4,0,1,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161613; --card:#222222; --well:#2b2b27; --well-2:#37362f;
    --ink:#fffeec; --ink-2:#b9b8a6; --ink-3:#7f7e70; --hair:#2f2f2a;
    --accent:#cac426; --accent-ink:#222222; --accent-tint:#3a3915; --accent-deep:#e3dd5a;
    --blob-a:#b7b21f; --blob-b:#e0a12a; --blob-c:#ef6a3a;
    --red:#ff453a; --green:#30d158; --track:#2f2f2a;
    --scrim:rgba(0,0,0,.6);
    --sh-1:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
    --sh-2:0 2px 4px rgba(0,0,0,.5),0 16px 48px rgba(0,0,0,.55);
    --sh-up:0 -8px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#161613; --card:#222222; --well:#2b2b27; --well-2:#37362f;
  --ink:#fffeec; --ink-2:#b9b8a6; --ink-3:#7f7e70; --hair:#2f2f2a;
  --accent:#cac426; --accent-ink:#222222; --accent-tint:#3a3915; --accent-deep:#e3dd5a;
  --blob-a:#b7b21f; --blob-b:#e0a12a; --blob-c:#ef6a3a;
  --red:#ff453a; --green:#30d158; --track:#2f2f2a;
  --scrim:rgba(0,0,0,.6);
  --sh-1:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --sh-2:0 2px 4px rgba(0,0,0,.5),0 16px 48px rgba(0,0,0,.55);
  --sh-up:0 -8px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.45;font-weight:500;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:none;
  padding-inline:20px;
  padding-block:0 calc(104px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;}
input,select,textarea{
  font:inherit;font-weight:500;color:var(--ink);background:var(--well);border:2px solid transparent;
  border-radius:16px;padding:13px 16px;width:100%;min-height:52px;appearance:none;
  transition:border-color .18s,background .18s;
}
input::placeholder,textarea::placeholder{color:var(--ink-3);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--card);}
button:focus-visible,a:focus-visible,label:focus-visible{outline:3px solid var(--accent-tint);outline-offset:2px;border-radius:12px;}
[hidden]{display:none !important;}
.shell{max-width:640px;margin:0 auto;}
#main{touch-action:pan-y;view-transition-name:main;}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:12px;padding-block:calc(12px + env(safe-area-inset-top)) 8px;min-height:60px;}
header.top .sp{flex:1;}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--well);color:var(--ink);transition:transform .14s var(--spring),background .2s;}
.iconbtn:active{transform:scale(.92);}
.iconbtn svg{width:20px;height:20px;}
.backbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 8px;border-radius:999px;background:var(--well);font-weight:700;font-size:15px;}
.backbtn svg{width:18px;height:18px;}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em;}
.brand img{width:26px;height:26px;border-radius:8px;display:block;}

/* ---------- type ---------- */
h1.big{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 6px;text-wrap:balance;}
h2{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px;line-height:1.15;}
.lede{color:var(--ink-2);font-size:15px;font-weight:500;margin:0 0 18px;max-width:52ch;line-height:1.5;}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;}
.sec h2{margin:0;font-size:19px;}
.sec .sp{flex:1;}
.sec .more{width:36px;height:36px;border-radius:50%;background:var(--well);display:grid;place-items:center;}
.sec .more svg{width:16px;height:16px;}
.small{font-size:13px;color:var(--ink-2);font-weight:500;}
.tiny{font-size:12px;color:var(--ink-3);font-weight:600;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- hero (home) ---------- */
.hero{
  position:relative;border-radius:28px;overflow:hidden;min-height:196px;
  color:#222222;padding:22px 22px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;
  box-shadow:var(--sh-2);background:var(--blob-a);isolation:isolate;
}
.hero .blobs{position:absolute;inset:-30%;z-index:-1;transition:transform 1.6s var(--spring);transform:translate(calc(var(--mx,0) * 1px),calc(var(--my,0) * 1px)) scale(calc(.62 + var(--fill,0) * .75));transform-origin:70% 60%;}
.hero .blobs i{position:absolute;border-radius:50%;filter:blur(38px);opacity:.95;will-change:transform;}
.hero .blobs i:nth-child(1){width:70%;height:70%;left:0;top:10%;background:var(--blob-a);animation:h1 14s var(--ease) infinite alternate;}
.hero .blobs i:nth-child(2){width:60%;height:60%;right:0;top:0;background:var(--blob-b);animation:h2 17s var(--ease) infinite alternate;}
.hero .blobs i:nth-child(3){width:64%;height:64%;left:25%;bottom:0;background:var(--blob-c);animation:h3 15s var(--ease) infinite alternate;}
@keyframes h1{to{transform:translate(18%,10%) scale(1.15);}}
@keyframes h2{to{transform:translate(-14%,16%) scale(1.1);}}
@keyframes h3{to{transform:translate(8%,-18%) scale(1.2);}}
.hero .eyebrow{font-size:13px;font-weight:700;opacity:.85;letter-spacing:.01em;}
.hero h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0;}
.hero .meta{font-size:14px;font-weight:600;opacity:.9;}
.hero .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.hero .btn{width:auto;background:#222222;color:#fffeec;box-shadow:0 8px 22px rgba(0,0,0,.18);}
.hero .btn.ghost{background:rgba(34,34,34,.12);color:#222222;box-shadow:none;}
.hero .mini{position:absolute;top:18px;right:18px;}

/* ---------- horizontal card rows ---------- */
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 14px;margin:0 -20px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.hrow::-webkit-scrollbar{display:none;}
.tile{
  flex:0 0 150px;scroll-snap-align:start;background:var(--card);border-radius:var(--r);padding:16px 14px 14px;
  box-shadow:var(--sh-1);text-align:left;display:grid;gap:10px;align-content:start;min-height:150px;
  transition:transform .16s var(--spring);animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms);
}
.tile:active{transform:scale(.96);}
.tile .il{width:56px;height:56px;}
.tile .il svg{width:100%;height:100%;display:block;}
.tile .t{font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.2;}
.tile .s{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:-4px;}
.tile.add{background:var(--well);box-shadow:none;place-content:center;justify-items:center;color:var(--ink-2);font-weight:700;}
.tile.add .plus{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh-1);font-size:24px;color:var(--ink);}
.tile .sw{width:44px;height:44px;border-radius:14px;}

/* ---------- cards & rows ---------- */
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--sh-1);}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800;letter-spacing:-.01em;}
.list{display:grid;gap:8px;}
.row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  min-height:var(--row);padding:9px 12px 9px 10px;width:100%;text-align:left;
  background:var(--card);border-radius:18px;box-shadow:var(--sh-1);
  transition:transform .14s var(--spring),background .22s var(--ease),box-shadow .22s;
  animation:rise .46s var(--ease) both;animation-delay:calc(var(--i,0) * 24ms);
}
.row:active{transform:scale(.982);}
.row.new{animation:pop .6s var(--spring) both;animation-delay:0s;}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{opacity:0;transform:scale(.9) translateY(10px);}55%{transform:scale(1.025);}100%{opacity:1;transform:none;}}
.row .t{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere;line-height:1.25;}
.row .s{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px;}
.row .chev{color:var(--ink-3);}
.row .chev svg{width:18px;height:18px;display:block;}
.thumb{
  width:44px;height:44px;border-radius:13px;flex:none;overflow:hidden;
  background:var(--well);display:grid;place-items:center;color:var(--ink-2);
}
.thumb svg{width:22px;height:22px;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb.lg{width:80px;height:80px;border-radius:18px;}
.thumb.lg svg{width:34px;height:34px;}
.swatch{width:14px;height:14px;border-radius:5px;flex:none;display:inline-block;vertical-align:-2px;}

/* pack rows */
.row.pack{grid-template-columns:auto auto 1fr auto;}
.tick{
  width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:2.5px solid var(--well-2);color:transparent;background:transparent;
  transition:background .22s var(--spring),border-color .22s,transform .3s var(--spring);
}
.tick svg{width:16px;height:16px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s var(--ease) .05s;}
.row.done{background:var(--well);box-shadow:none;}
.row.done .t{color:var(--ink-2);}
.row.done .tick{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.08);}
.row.done .tick svg{stroke-dashoffset:0;}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;letter-spacing:.01em;white-space:nowrap;}

/* group headers on the pack screen */
.grp{margin-top:18px;}
.grp .gh{display:flex;align-items:center;gap:10px;padding:0 4px 10px;}
.grp .gh .t{font-weight:800;font-size:15px;}
.grp .gh .c{margin-left:auto;font-size:13px;color:var(--ink-2);font-weight:700;}
.grp.oneoff{background:var(--accent-tint);border-radius:var(--r);padding:14px;margin-top:14px;}
.grp.oneoff .gh .t{color:var(--ink);}
.grp.oneoff .why{font-size:13px;color:var(--ink-2);margin:-4px 4px 10px;font-weight:600;}
.grp .body{overflow:hidden;transition:max-height .45s var(--ease),opacity .3s;}
.grp.collapsed .body{max-height:0 !important;opacity:0;}
.donerow{
  display:flex;align-items:center;gap:12px;background:var(--well);border-radius:18px;padding:12px 14px;
  font-weight:700;color:var(--ink-2);animation:pop .5s var(--spring) both;width:100%;text-align:left;
}
.donerow .tick{width:26px;height:26px;background:var(--green);border-color:var(--green);color:#fff;}
.donerow .tick svg{stroke-dashoffset:0;}

/* ---------- rings ---------- */
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:4px 0 6px;}
.rings{width:168px;height:168px;position:relative;}
.rings svg{width:100%;height:100%;display:block;transform:rotate(-90deg);}
.rings circle.tr{fill:none;stroke:var(--track);}
.rings circle.ar{fill:none;stroke-linecap:round;transition:stroke-dashoffset .9s var(--spring),stroke .9s var(--ease);}
.rings.glow circle.ar{filter:drop-shadow(0 0 6px currentColor);}
.rings .mid{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;}
.rings .mid b{font-size:22px;font-weight:800;letter-spacing:-.03em;}
.stats{display:grid;gap:10px;}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.stat b small{font-size:14px;color:var(--ink-3);font-weight:700;letter-spacing:0;}
.stat span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:700;margin-top:3px;}
.stat i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;}

.mini{width:44px;height:44px;position:relative;flex:none;}
.mini svg{width:100%;height:100%;display:block;transform:rotate(-90deg);}
.mini circle.tr{fill:none;stroke:var(--track);}
.mini circle.ar{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s var(--spring),stroke .6s;}
.hero .mini circle.tr{stroke:rgba(34,34,34,.18);}
.hero .mini circle.ar{stroke:#222222 !important;}

/* case gauges strip */
.gauges{display:flex;gap:14px;overflow-x:auto;padding:6px 20px 12px;margin:6px -20px 0;scrollbar-width:none;}
.gauges::-webkit-scrollbar{display:none;}
.gauge{flex:0 0 auto;display:grid;justify-items:center;gap:4px;width:64px;}
.gauge svg{width:56px;height:34px;display:block;}
.gauge path.tr{fill:none;stroke:var(--track);stroke-width:7;stroke-linecap:round;}
.gauge path.ar{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s var(--spring),stroke .6s;}
.gauge .n{font-size:11px;font-weight:700;color:var(--ink-2);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;padding:13px 22px;border-radius:999px;
  font-weight:800;font-size:15.5px;letter-spacing:-.01em;
  background:var(--well);color:var(--ink);
  transition:transform .14s var(--spring),box-shadow .2s,background .2s,opacity .2s;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -8px var(--accent);}
.btn.primary:active{box-shadow:0 4px 10px -6px var(--accent);}
.btn.dark{background:var(--ink);color:var(--bg);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--red);}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14px;width:auto;}
.btn[disabled]{opacity:.4;pointer-events:none;}
.btn+.btn{margin-top:8px;}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btnrow .btn+.btn{margin-top:0;}
.btn svg{width:18px;height:18px;}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--well);padding:4px;border-radius:999px;}
.seg button{font-size:14px;font-weight:700;color:var(--ink-2);padding:10px 4px;border-radius:999px;min-height:40px;transition:background .2s var(--ease);}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-1);}

.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 15px;
  border-radius:999px;background:var(--well);font-size:14px;font-weight:700;color:var(--ink-2);
  transition:background .18s var(--ease),color .18s var(--ease),transform .14s var(--spring);
}
.chip:active{transform:scale(.95);}
.chip.on{background:var(--ink);color:var(--bg);}
.chip.new{animation:pop .5s var(--spring) both;}

.search{position:relative;margin-bottom:14px;}
.search input{padding-left:46px;border-radius:999px;}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3);}

.empty{background:var(--well);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--ink-2);font-size:14.5px;font-weight:500;}
.empty strong{display:block;color:var(--ink);font-size:16px;font-weight:800;margin-bottom:4px;}
.empty .il{width:64px;height:64px;margin:0 auto 10px;display:block;}
.empty .il svg{width:100%;height:100%;}

.field{display:grid;gap:7px;}
.field label{font-size:13px;font-weight:700;color:var(--ink-2);padding-left:4px;}
.fields{display:grid;gap:14px;}
.note{font-size:13px;color:var(--ink-3);margin:8px 0 0;line-height:1.45;font-weight:500;}

/* ---------- pick list (kit editor) ---------- */
.pick{display:grid;gap:6px;}
.pick button{
  display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:11px;
  min-height:52px;padding:6px 10px;border-radius:16px;text-align:left;background:var(--well);
  transition:background .18s var(--ease),transform .12s var(--spring);
}
.pick button:active{transform:scale(.985);}
.pick button .t{display:block;font-size:15px;font-weight:700;}
.pick button .s{display:block;font-size:12px;color:var(--ink-2);font-weight:600;}
.pick button.on{background:var(--accent-tint);}
.pick button.on .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.08);}
.pick button.on .tick svg{stroke-dashoffset:0;}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .24s var(--ease) both;}
.scrim.out{animation:fadeout .2s var(--out) both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes fadeout{from{opacity:1;}to{opacity:0;}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;box-shadow:var(--sh-up);
  animation:up .46s var(--spring) both;touch-action:pan-y;will-change:transform;
}
.sheet.out{animation:down .22s var(--out) both;}
@keyframes up{from{transform:translateY(80px);opacity:0;}to{transform:none;opacity:1;}}
@keyframes down{from{transform:none;opacity:1;}to{transform:translateY(100%);opacity:0;}}
.sheet .inner{max-width:640px;margin:0 auto;display:grid;gap:14px;}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--well-2);margin:0 auto 6px;}
.sheet h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em;}
.sheet .actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:2px;}
.sheet .actions .btn{margin:0;}

/* ---------- photo picker ---------- */
.photo{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;}
.photo .fileb{position:relative;overflow:hidden;display:inline-block;}
.photo input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo .btn{margin:0;}

/* ---------- first run ---------- */
.fr0{
  position:fixed;inset:0;z-index:35;color:#222222;background:var(--blob-a);overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px calc(28px + env(safe-area-inset-bottom));
}
.fr0 .blobs{position:absolute;inset:-25%;z-index:0;}
.fr0 .blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.95;}
.fr0 .blobs i:nth-child(1){width:70%;height:70%;left:-5%;top:0;background:var(--blob-a);animation:h1 16s var(--ease) infinite alternate;}
.fr0 .blobs i:nth-child(2){width:60%;height:60%;right:-5%;top:10%;background:var(--blob-b);animation:h2 19s var(--ease) infinite alternate;}
.fr0 .blobs i:nth-child(3){width:64%;height:64%;left:20%;bottom:-5%;background:var(--blob-c);animation:h3 17s var(--ease) infinite alternate;}
.fr0 .in{position:relative;z-index:1;max-width:560px;}
.fr0 .mark{width:52px;height:52px;border-radius:14px;background:#222222;display:grid;place-items:center;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.2);}
.fr0 .mark img{width:36px;height:36px;border-radius:8px;}
.fr0 h1{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:0 0 14px;}
.fr0 p{font-size:16px;font-weight:600;opacity:.92;margin:0 0 24px;line-height:1.45;max-width:36ch;}
.fr0 .btn{background:#222222;color:#fffeec;box-shadow:0 10px 30px rgba(0,0,0,.22);}
.fr0 .btn.ghost{background:rgba(34,34,34,.12);color:#222222;box-shadow:none;margin-top:8px;}
.fr{min-height:calc(100vh - 180px);display:flex;flex-direction:column;}
.fr .grow{flex:1;}
.fr0{view-transition-name:blob;}
.hero.frh{view-transition-name:blob;min-height:112px;padding:16px 18px 14px;margin:8px 0 18px;justify-content:flex-end;}
.hero.frh .k{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.hero.frh .m{font-size:13px;font-weight:700;opacity:.8;margin-top:2px;}
.hero.frh .blobs{transform-origin:80% 70%;}
::view-transition-group(blob){animation-duration:.55s;animation-timing-function:var(--spring);}
::view-transition-old(blob),::view-transition-new(blob){animation:none;mix-blend-mode:normal;height:100%;overflow:hidden;}
.still .row,.still .tile{animation:none !important;}
.addbar{display:grid;grid-template-columns:1fr auto;gap:8px;}
.addbar .btn{margin:0;width:auto;}
.fr .list{margin-top:6px;}
.fr .count{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 8px 4px;}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);box-shadow:0 -1px 0 var(--hair);padding:6px 12px calc(6px + env(safe-area-inset-bottom));}
.tabs .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.tab{display:grid;justify-items:center;gap:3px;padding:8px 4px 6px;border-radius:14px;font-size:11px;font-weight:700;color:var(--ink-3);min-height:54px;transition:color .2s,transform .14s var(--spring);}
.tab:active{transform:scale(.92);}
.tab svg{width:24px;height:24px;transition:transform .35s var(--spring);}
.tab.on{color:var(--ink);}
.tab.on svg{transform:translateY(-1px) scale(1.08);}
.tab.on .fillme{fill:var(--accent);stroke:var(--accent);}

/* ---------- toast ---------- */
.toast{pointer-events:none;position:fixed;left:20px;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:45;max-width:600px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:13px 16px;font-size:14.5px;font-weight:700;box-shadow:var(--sh-2);transform:translateY(calc(100% + 160px));transition:transform .42s var(--spring);}
.toast.up{transform:none;}
.toast.bad{background:var(--red);color:#fff;}

/* ---------- the punch ---------- */
.punch{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;}
.punch .bg{position:absolute;inset:0;background:var(--scrim);animation:fade .25s var(--ease) both;}
.punch .bg.out{animation:fadeout .3s var(--out) both;}
.punch .ic{width:168px;height:168px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:punch .8s var(--spring) both;}
.punch .ic.out{animation:punchout .3s var(--out) both;}
.punch .ic svg{width:92px;height:92px;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s var(--ease) .25s both;}
@keyframes punch{0%{transform:scale(.15) rotate(-14deg);opacity:0;}60%{transform:scale(1.14) rotate(2deg);opacity:1;}100%{transform:none;opacity:1;}}
@keyframes punchout{to{transform:scale(1.3);opacity:0;}}
@keyframes draw{to{stroke-dashoffset:0;}}
.ready{background:var(--green);color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:0 12px 30px -10px var(--green);animation:pop .55s var(--spring) both;}
.ready h3{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:-.02em;}
.ready p{margin:0;font-size:14px;font-weight:600;opacity:.92;}

footer.build{margin-top:28px;padding-top:14px;box-shadow:0 -1px 0 var(--hair);font-size:12px;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

/* ---------- page transitions ---------- */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal;}
::view-transition-old(main),::view-transition-new(main){animation-duration:.34s;animation-timing-function:var(--ease);animation-fill-mode:both;}
html[data-dir="fwd"]::view-transition-old(main){animation-name:out-l;}
html[data-dir="fwd"]::view-transition-new(main){animation-name:in-r;}
html[data-dir="back"]::view-transition-old(main){animation-name:out-r;}
html[data-dir="back"]::view-transition-new(main){animation-name:in-l;}
html[data-dir="fade"]::view-transition-old(main){animation-name:fadeout;animation-duration:.18s;}
html[data-dir="fade"]::view-transition-new(main){animation-name:rise;animation-duration:.3s;}
@keyframes out-l{to{transform:translateX(-56px);opacity:0;}}
@keyframes out-r{to{transform:translateX(56px);opacity:0;}}
@keyframes in-r{from{transform:translateX(56px);opacity:0;}}
@keyframes in-l{from{transform:translateX(-56px);opacity:0;}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important;}
}
</style>

<script>
"use strict";

const BUILD = 6;                 // bump on EVERY deploy, in sw.js too
const DB_NAME = "kitcheck";
const DB_VERSION = 1;

const CATS = ["camera","lens","audio","power","light","grip","drone","misc"];
const PALETTE = ["#8b9296","#2b2f31","#3f6f8f","#7a5c3e","#4d6b4a","#8a4b52","#6b5a86","#a8813c","#c9a227","#c74d3c"];
const TAB_ORDER = ["home","gigs","gear","kits"];

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => { try { return crypto.randomUUID().replace(/-/g,"").slice(0,16); } catch(e){ return "x"+Math.random().toString(36).slice(2,12)+Date.now().toString(36); } };
const now = () => new Date().toISOString();
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtBytes = b => b == null ? "—" : b < 1024 ? b+" B" : b < 1048576 ? (b/1024).toFixed(1)+" KB" : b < 1073741824 ? (b/1048576).toFixed(1)+" MB" : (b/1073741824).toFixed(2)+" GB";
const byName = (a,b) => String(a.name||"").localeCompare(String(b.name||""), undefined, {sensitivity:"base"});
const byOrder = (a,b) => (a.order||0)-(b.order||0) || byName(a,b);
const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let prevView = null, lastAdded = null, skipVT = false;
function fmtDate(d){ if(!d) return "No date"; const p=String(d).split("-"); if(p.length!==3) return d; const dt=new Date(+p[0],+p[1]-1,+p[2]); if(isNaN(dt)) return d;
  const t=new Date(); t.setHours(0,0,0,0); const diff=Math.round((dt-t)/86400000);
  const s=dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(diff===0) return "Today · "+s; if(diff===1) return "Tomorrow · "+s; if(diff>1&&diff<7) return "In "+diff+" days · "+s; return s; }
const ico = id => `<svg><use href="#${id}"/></svg>`;
const chev = `<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>`;
const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

let toastTimer = null;
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.classList.toggle("bad",!!bad); t.classList.add("up"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("up"),3400); }

/* ============================================================
   DB
   ============================================================ */
const DB = {
  _db: null,
  migrations: [
    function v1(db){
      db.createObjectStore("meta",       {keyPath:"key"});
      db.createObjectStore("containers", {keyPath:"id"});
      db.createObjectStore("items",      {keyPath:"id"}).createIndex("byContainer","containerId");
      db.createObjectStore("kits",       {keyPath:"id"});
      db.createObjectStore("gigs",       {keyPath:"id"}).createIndex("byDate","date");
      db.createObjectStore("photos",     {keyPath:"id"});
    }
  ],
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      const req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onupgradeneeded=e=>{ const db=req.result; for(let v=e.oldVersion; v<DB_VERSION; v++) DB.migrations[v](db,req.transaction); };
      req.onsuccess=()=>{ this._db=req.result; res(this._db); };
      req.onerror=()=>rej(req.error);
      req.onblocked=()=>rej(new Error("Database blocked by another open tab."));
    });
  },
  tx(stores,mode){ if(!this._db) throw new Error("Database not open yet."); return this._db.transaction(stores,mode||"readonly"); },
  _req(store,mode,fn){ return this.open().then(()=>new Promise((res,rej)=>{ const tx=this.tx([store],mode); const r=fn(tx.objectStore(store)); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); tx.onabort=()=>rej(tx.error); })); },
  all(store){ return this._req(store,"readonly",s=>s.getAll()).then(r=>r||[]); },
  put(store,v){ return this._req(store,"readwrite",s=>s.put(v)).then(()=>v); },
  get(store,k){ return this._req(store,"readonly",s=>s.get(k)); },
  del(store,k){ return this._req(store,"readwrite",s=>s.delete(k)); },
  putMany(store,arr){ return this.open().then(()=>new Promise((res,rej)=>{ const tx=this.tx([store],"readwrite"); const os=tx.objectStore(store); arr.forEach(v=>os.put(v)); tx.oncomplete=()=>res(arr.length); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); })); },
  clearAll(){ const stores=["meta","containers","items","kits","gigs","photos"]; return this.open().then(()=>new Promise((res,rej)=>{ const tx=this.tx(stores,"readwrite"); stores.forEach(s=>tx.objectStore(s).clear()); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); })); },
  counts(){ const s=["containers","items","kits","gigs","photos"]; return Promise.all(s.map(n=>this.all(n).then(r=>[n,r.length]))).then(Object.fromEntries); }
};

/* ============================================================
   Store — in-memory cache, write-through
   ============================================================ */
const S = { containers:{}, items:{}, kits:{}, gigs:{}, meta:{} };
const Store = {
  async load(){ for(const c of ["containers","items","kits","gigs"]){ S[c]={}; (await DB.all(c)).forEach(r=>S[c][r.id]=r); } S.meta={}; (await DB.all("meta")).forEach(r=>S.meta[r.key]=r.value); },
  list(c){ return Object.values(S[c]); },
  async save(c,rec){ if(!S[c][rec.id]) lastAdded=rec.id; S[c][rec.id]=rec; try{ await DB.put(c,rec); }catch(e){ toast(saveErr(e),true); } return rec; },
  async remove(c,id){ delete S[c][id]; try{ await DB.del(c,id); }catch(e){ toast(saveErr(e),true); } },
  async setMeta(key,value){ S.meta[key]=value; try{ await DB.put("meta",{key,value}); }catch(e){} },
};
function saveErr(e){ const n=e&&e.name; if(n==="QuotaExceededError") return "Storage is full. Delete some photos or export and clear."; return "That didn't save. Try again."; }

/* ============================================================
   Photos
   ============================================================ */
const Photos = {
  MAX: 800, _urls: {},
  async process(file){
    const bmp = await createImageBitmap(file).catch(()=>null);
    let src=bmp, w, h;
    if(bmp){ w=bmp.width; h=bmp.height; }
    else { src=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); }); w=src.naturalWidth; h=src.naturalHeight; }
    const scale=Math.min(1,this.MAX/Math.max(w,h));
    const cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
    const cv=document.createElement("canvas"); cv.width=cw; cv.height=ch; cv.getContext("2d").drawImage(src,0,0,cw,ch);
    if(bmp&&bmp.close) bmp.close();
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.82));
    if(!blob) throw new Error("Couldn't process that image.");
    return blob;
  },
  async store(file){ const blob=await this.process(file); const id=uid(); await DB.put("photos",{id,blob}); return id; },
  async url(id){ if(!id) return null; if(this._urls[id]) return this._urls[id]; const rec=await DB.get("photos",id); if(!rec||!rec.blob) return null; this._urls[id]=URL.createObjectURL(rec.blob); return this._urls[id]; },
  async remove(id){ if(!id) return; try{ await DB.del("photos",id); }catch(e){} if(this._urls[id]){ URL.revokeObjectURL(this._urls[id]); delete this._urls[id]; } },
  reset(){ Object.keys(this._urls).forEach(k=>URL.revokeObjectURL(this._urls[k])); this._urls={}; }
};
async function hydratePhotos(root){ for(const im of $$("[data-photo]",root)){ const u=await Photos.url(im.dataset.photo); if(u){ const img=document.createElement("img"); img.alt=""; img.src=u; im.replaceChildren(img); } } }
function thumb(it,lg){
  const cls="thumb"+(lg?" lg":"");
  const g=ico("g-"+(it&&CATS.includes(it.category)?it.category:"misc"));
  if(it&&it.photoId) return `<span class="${cls}" data-photo="${esc(it.photoId)}">${g}</span>`;
  return `<span class="${cls}">${g}</span>`;
}

/* ============================================================
   Backup
   ============================================================ */
const blobToDataURL = b => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(b); });
const dataURLToBlob = async d => (await fetch(d)).blob();
const Backup = {

const SW={state:"unsupported",updateReady:false};
async function initSW(){
  if(!("serviceWorker" in navigator)) return;
  SW.state="registering";
  try{
    const reg=await navigator.serviceWorker.register("sw.js");
    SW.state=reg.active?"active":"installing";
    reg.addEventListener("updatefound",()=>{ const nw=reg.installing; if(!nw) return; nw.addEventListener("statechange",()=>{ if(nw.state==="installed"&&navigator.serviceWorker.controller){ SW.updateReady=true; toast("Update ready. Reload to get it."); if(route.view==="settings") render(); } if(nw.state==="activated"){ SW.state="active"; if(route.view==="settings") render(); } }); });
    navigator.serviceWorker.addEventListener("controllerchange",()=>location.reload());
  }catch(e){ SW.state="failed"; }
  if(route.view==="settings") render();
}

/* ============================================================
   Gig helpers
   ============================================================ */
function itemsOf(g){
  const src={};
  (g.kitIds||[]).forEach(k=>{ const kit=S.kits[k]; if(!kit) return; (kit.itemIds||[]).forEach(i=>{ if(S.items[i]) src[i]=src[i]||"kit"; }); });
  (g.extraItemIds||[]).forEach(i=>{ if(S.items[i]) src[i]="extra"; });
  return Object.keys(src).map(i=>({item:S.items[i],src:src[i]}));
}
function casesOf(g,list){
  list=list||itemsOf(g); const used={}; list.forEach(e=>{ used[e.item.containerId&&S.containers[e.item.containerId]?e.item.containerId:"__none"]=true; });
  const cs=Store.list("containers").sort(byOrder).filter(c=>used[c.id]);
  if(used.__none) cs.push({id:"__none",name:"Loose items",color:"#8b9296"});
  return cs;
}
function progress(g){
  const list=itemsOf(g), p=g.packed||{}, l=g.loaded||{};
  const total=list.length, done=list.filter(e=>p[e.item.id]).length;
  const ex=list.filter(e=>e.src==="extra"), exDone=ex.filter(e=>p[e.item.id]).length;
  const cases=casesOf(g,list), cDone=cases.filter(c=>l[c.id]).length;
  return {total,done,exTotal:ex.length,exDone,cTotal:cases.length,cDone,full:total>0&&done===total,loaded:cases.length>0&&cDone===cases.length};
}
function nextGig(){ const t=today(); const up=Store.list("gigs").filter(g=>!g.completedAt&&(!g.date||g.date>=t)).sort((a,b)=>String(a.date||"9999").localeCompare(String(b.date||"9999"))); return up[0]||null; }
/* red -> green as it fills */
const heat = p => `hsl(${Math.round(4+136*Math.max(0,Math.min(1,p)))} 78% ${p>=1?44:50}%)`;

/* ============================================================
   Rings
   ============================================================ */
function ringArcs(prog){
  return [
    {r:74,p:prog.total?prog.done/prog.total:0,on:prog.total>0},
    {r:56,p:prog.exTotal?prog.exDone/prog.exTotal:0,on:prog.exTotal>0},
    {r:38,p:prog.cTotal?prog.cDone/prog.cTotal:0,on:prog.cTotal>0&&prog.full},
  ].map(a=>Object.assign(a,{c:2*Math.PI*a.r,col:a.on?heat(a.p):"transparent",off:(2*Math.PI*a.r*(1-(a.on?a.p:0))).toFixed(1)}));
}
function ringsSVG(prog){
  let h=`<svg viewBox="0 0 168 168">`;
  ringArcs(prog).forEach(a=>{ h+=`<circle class="tr" cx="84" cy="84" r="${a.r}" stroke-width="14"/><circle class="ar" cx="84" cy="84" r="${a.r}" stroke-width="14" stroke="${a.col}" stroke-dasharray="${a.c.toFixed(1)}" stroke-dashoffset="${a.off}" style="color:${a.col}"/>`; });
  h+=`</svg><div class="mid"><b class="num">${prog.total?Math.round(prog.done/prog.total*100)+"%":"—"}</b></div>`;
  return h;
}
const gaugeLen=Math.PI*24;
function miniSVG(p,on){ const r=18,c=2*Math.PI*r; return `<svg viewBox="0 0 44 44"><circle class="tr" cx="22" cy="22" r="${r}" stroke-width="6"/><circle class="ar" cx="22" cy="22" r="${r}" stroke-width="6" stroke="${on?heat(p):"transparent"}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-(on?p:0))).toFixed(1)}"/></svg>`; }
function gaugeSVG(p){ return `<svg viewBox="0 0 56 34"><path class="tr" d="M4 30 A24 24 0 0 1 52 30"/><path class="ar" d="M4 30 A24 24 0 0 1 52 30" stroke="${heat(p)}" stroke-dasharray="${gaugeLen.toFixed(1)}" stroke-dashoffset="${(gaugeLen*(1-p)).toFixed(1)}"/></svg>`; }

function needsFirstRun(){ return !S.meta.onboarded && Store.list("items").length===0 && Store.list("kits").length===0; }

/* ============================================================
   Render
   ============================================================ */
function render(opts){
  opts=opts||{};
  parseHash();
  if(needsFirstRun()&&route.view!=="first-run"&&route.view!=="settings") route.view="first-run";
  const changed=(prevView!==null&&prevView!==route.view)||!!opts.vt;
  let dir=opts.vt||"fade";
  if(changed){ const a=TAB_ORDER.indexOf(prevView), b=TAB_ORDER.indexOf(route.view);
    if(a>-1&&b>-1) dir=b>a?"fwd":"back"; else if(a>-1&&b===-1) dir="fwd"; else if(a===-1&&b>-1) dir="back"; }

  const paint=()=>{
    const tabs=$("#tabs"); tabs.hidden=(route.view==="first-run");
    $$(".tab").forEach(t=>t.classList.toggle("on",t.dataset.go===route.view));
    const top=$("#top"), main=$("#main"); let html="";
    if(route.view==="first-run"){ top.innerHTML=""; html=FirstRun.view(); }
    else {
      top.innerHTML=Views.header(route.view);
      const V={home:Home,gigs:Gigs,gig:Pack,gear:Gear,kits:Kits,settings:Settings}[route.view]||Home;
      html=V.view();
    }
    main.classList.toggle("still",!!opts.still);
    main.innerHTML=html;
    $$(".row, .tile",main).forEach((r,i)=>r.style.setProperty("--i",Math.min(i,14)));
    if(lastAdded){ const el=main.querySelector('[data-id="'+lastAdded+'"]'); if(el){ el.classList.add("new"); el.style.setProperty("--i",0); } lastAdded=null; }
    hydratePhotos(main);
    if(route.view==="first-run") FirstRun.after();
    if(route.view==="gear") Gear.after();
    if(route.view==="gig") Pack.after();
    $("#buildLine").textContent="Build "+BUILD;
    $("#netLine").textContent=navigator.onLine?"Online":"Offline, working anyway";
  };

  if(changed&&!skipVT&&!reduced()&&document.startViewTransition){
    document.documentElement.setAttribute("data-dir",dir);
    try{ document.startViewTransition(paint).finished.finally(()=>document.documentElement.removeAttribute("data-dir")); }
    catch(e){ paint(); document.documentElement.removeAttribute("data-dir"); }
  } else paint();
  skipVT=false; prevView=route.view;
}

/* ============================================================
   Pack — the heart of the app (SPEC 4.3)
   ============================================================ */
const Pack={
  wasFull:null,
  view(){
    const g=S.gigs[route.arg]; if(!g) return `<div class="empty"><strong>That gig is gone.</strong></div>`;
    const list=itemsOf(g), p=progress(g), packed=g.packed||{}, loaded=g.loaded||{};
    let h=`<h1 class="big">${esc(g.name||"Untitled")}</h1><p class="lede" style="margin-bottom:12px;">${esc(fmtDate(g.date))}${g.client?" · "+esc(g.client):""}</p>`;

    /* rings + stats */
    h+=`<div class="card"><div class="ringwrap"><div class="rings${p.full?" glow":""}" id="rings">${ringsSVG(p)}</div><div class="stats">
      ${statHTML(p)}
    </div></div>`;
    const cases=casesOf(g,list);
    if(cases.length>1){ h+=`<div class="gauges">`; cases.forEach(c=>{ const arr=list.filter(e=>(e.item.containerId&&S.containers[e.item.containerId]?e.item.containerId:"__none")===c.id); const d=arr.filter(e=>packed[e.item.id]).length; h+=`<button class="gauge" data-act="jump" data-id="${esc(c.id)}">${gaugeSVG(arr.length?d/arr.length:0)}<span class="n">${esc(c.name)}</span></button>`; }); h+=`</div>`; }
    h+=`</div>`;

    if(p.loaded){ h+=`<div class="ready"><h3>Ready to roll.</h3><p>Everything's packed and every case is in the car.</p></div>`; }
    else if(p.full){ h+=`<div class="ready" style="background:var(--ink);color:var(--bg);box-shadow:var(--sh-2);"><h3>Everything's in a case.</h3><p>Now get the cases into the car.</p></div>`; }

    /* load out */
    if(p.full){
      h+=`<div class="grp" id="loadout"><div class="gh"><span class="t">Cases in the car</span><span class="c">${p.cDone}/${p.cTotal}</span></div><div class="list">`;
      cases.forEach(c=>{ const on=!!loaded[c.id]; h+=`<button class="row pack${on?" done":""}" data-act="load" data-id="${esc(c.id)}"><span class="tick">${checkSvg}</span><span class="swatch" style="background:${esc(c.color)};width:22px;height:22px;border-radius:7px;"></span><span><span class="t">${esc(c.name)}</span></span><span></span></button>`; });
      h+=`</div></div>`;
    }

    /* one-offs: the block that is the product */
    const ex=list.filter(e=>e.src==="extra");
    if(ex.length){ const d=ex.filter(e=>packed[e.item.id]).length;
      h+=`<div class="grp oneoff" id="grp-oneoff"><div class="gh"><span class="t">Added for this shoot</span><span class="c">${d}/${ex.length}</span></div><p class="why">Not in your usual kit. These are the ones that get left behind.</p><div class="list">`;
      ex.sort((a,b)=>byName(a.item,b.item)).forEach(e=>h+=packRow(e.item,!!packed[e.item.id],true)); h+=`</div></div>`; }

    /* case groups */
    const groups={}; list.filter(e=>e.src!=="extra").forEach(e=>{ const k=e.item.containerId&&S.containers[e.item.containerId]?e.item.containerId:"__none"; (groups[k]=groups[k]||[]).push(e.item); });
    cases.forEach(c=>{ const arr=groups[c.id]; if(!arr||!arr.length) return; const d=arr.filter(i=>packed[i.id]).length, all=d===arr.length;
      h+=`<div class="grp${all?" collapsed":""}" id="grp-${esc(c.id)}" data-case="${esc(c.id)}">`;
      if(all) h+=donerowHTML(c,arr.length);
      h+=`<div class="body"${all?' style="max-height:0"':""}><div class="gh"><span class="swatch" style="background:${esc(c.color)}"></span><span class="t">${esc(c.name)}</span><span class="c">${d}/${arr.length}</span></div><div class="list">`;
      arr.sort(byName).forEach(i=>h+=packRow(i,!!packed[i.id],false)); h+=`</div></div></div>`; });

    if(!list.length) h+=`<div class="empty" style="margin-top:14px;"><span class="il">${ico("il-empty")}</span><strong>Nothing on the list</strong>Add a kit, or a one-off item.</div>`;

    if(!notes.length) h+=`<div class="empty" style="padding:18px;">Anything you think of between now and shoot day. It's here when you pack.</div>`;

    h+=`<button class="btn ghost danger" data-act="gig-del" style="margin-top:22px;">Delete this gig</button>`;
    return h;
  },
  after(){
    const g=S.gigs[route.arg]; if(!g) return;
    const p=progress(g);
    if(this.wasFull===false&&p.full) punch();
    this.wasFull=p.full; this.wasLoaded=p.loaded;
  },
  /* Patch the screen from state without re-rendering, so transitions run.
     Returns false when the structure changes (packed↔full, loaded), which
     needs a real render. */
  refresh(){
    const g=S.gigs[route.arg]; if(!g) return false;
    const p=progress(g), list=itemsOf(g), packed=g.packed||{};
    if(p.full!==this.wasFull||p.loaded!==this.wasLoaded) return false;
    const rings=$("#rings");
    if(rings){ const arcs=ringArcs(p); $$("circle.ar",rings).forEach((c,i)=>{ const a=arcs[i]; if(!a) return; c.setAttribute("stroke",a.col); c.style.color=a.col; c.setAttribute("stroke-dashoffset",a.off); }); const mid=$(".mid b",rings); if(mid) mid.textContent=p.total?Math.round(p.done/p.total*100)+"%":"—"; rings.classList.toggle("glow",p.full); }
    const stats=$(".stats"); if(stats) stats.innerHTML=statHTML(p);
    const cases=casesOf(g,list);
    $$(".gauge[data-id]").forEach(el=>{ const cid=el.dataset.id; const arr=list.filter(e=>(e.item.containerId&&S.containers[e.item.containerId]?e.item.containerId:"__none")===cid); const q=arr.length?arr.filter(e=>packed[e.item.id]).length/arr.length:0; const ar=$("path.ar",el); if(ar){ ar.setAttribute("stroke",heat(q)); ar.setAttribute("stroke-dashoffset",(gaugeLen*(1-q)).toFixed(1)); } });

function wireSheetDrag(s){
  let y0=0,dy=0,on=false;
  s.addEventListener("touchstart",e=>{ if(s.scrollTop>0||e.touches.length!==1){ on=false; return; } y0=e.touches[0].clientY; dy=0; on=true; s.style.transition="none"; },{passive:true});
  s.addEventListener("touchmove",e=>{ if(!on) return; dy=e.touches[0].clientY-y0; if(dy<=0){ dy=0; s.style.transform=""; return; } e.preventDefault(); s.style.transform="translateY("+dy.toFixed(1)+"px)"; },{passive:false});
  const end=()=>{ if(!on) return; on=false; if(dy>110) closeSheet(); else { s.style.transition="transform .38s var(--spring)"; s.style.transform=""; } };
  s.addEventListener("touchend",end); s.addEventListener("touchcancel",end);
}

function pickList(selSet,filterFn,emptyMsg){
  const items=Store.list("items").filter(i=>!i.archived).filter(filterFn||(()=>true)).sort(byName);
  const groups={}; items.forEach(i=>{ const k=i.containerId&&S.containers[i.containerId]?i.containerId:"__none"; (groups[k]=groups[k]||[]).push(i); });
  const order=Store.list("containers").sort(byOrder).map(c=>c.id); order.push("__none"); let h="";
  order.forEach(cid=>{ const arr=groups[cid]; if(!arr) return; const c=S.containers[cid]||{name:"Not in a case",color:"#8b9296"};
    h+=`<div class="sec" style="margin:12px 0 8px;"><span class="swatch" style="background:${esc(c.color)}"></span><h2 style="font-size:15px;">${esc(c.name)}</h2></div><div class="pick">`;
    arr.forEach(i=>{ h+=`<button type="button" class="${selSet.has(i.id)?"on":""}" data-pick="${esc(i.id)}"><span class="tick">${checkSvg}</span>${thumb(i)}<span><span class="t">${esc(i.name)}</span><span class="s">${esc(i.category)}</span></span></button>`; }); h+=`</div>`; });
  return items.length?h:`<div class="empty">${emptyMsg||"Add some gear first."}</div>`;
}
function wirePick(s,sel){
  $("#kList",s).addEventListener("click",e=>{ const b=e.target.closest("[data-pick]"); if(!b) return; const id=b.dataset.pick; if(sel.has(id)) sel.delete(id); else sel.add(id); b.classList.toggle("on",sel.has(id)); const c=$("#kCount",s); if(c) c.textContent=sel.size; });
  const q=$("#kQ",s); if(q) q.addEventListener("input",e=>{ const v=e.target.value.trim().toLowerCase(); $$("[data-pick]",s).forEach(b=>{ const i=S.items[b.dataset.pick]; b.hidden=v&&!(i.name.toLowerCase().includes(v)); }); $$(".sec",s).forEach(t=>{ const p=t.nextElementSibling; t.hidden=p&&!$$("[data-pick]:not([hidden])",p).length; }); });
}
function sheetKit(k){
  const sel=new Set((k&&k.itemIds)||[]);
  const body=`<div class="fields"><div class="field"><label for="kName">Name</label><input id="kName" value="${esc(k?k.name:"")}" placeholder="Interview audio" autocapitalize="words"></div>
    <div class="search" style="margin:0;">${searchSvg}<input id="kQ" placeholder="Filter gear" type="search" autocomplete="off"></div>
    <div id="kList">${pickList(sel)}</div><p class="note"><span id="kCount">${sel.size}</span> selected</p>
    ${k?`<button class="btn ghost danger" type="button" id="kDel">Delete this kit</button>`:""}</div>`;
  sheet(k?"Edit kit":"New kit",body,async()=>{ const name=val("kName"); if(!name){ toast("It needs a name."); return false; } await Store.save("kits",{id:k?k.id:uid(),name,itemIds:Array.from(sel),order:k?k.order:Store.list("kits").length}); render(); toast((k?"Saved ":"Created ")+name+"."); },k?"Save":"Create",s=>{
    wirePick(s,sel); const del=$("#kDel",s); if(del) del.onclick=async()=>{ if(!confirm("Delete "+k.name+"?")) return; await Store.remove("kits",k.id); closeSheet(); render(); toast("Deleted."); };
  });
}
function sheetGig(g){
  const kits=Store.list("kits").sort(byOrder); const sel=new Set((g&&g.kitIds)||[]);
  const body=`<div class="fields"><div class="field"><label for="gName">Name</label><input id="gName" value="${esc(g?g.name:"")}" placeholder="Gonyea walkthrough" autocapitalize="words"></div>
    <div class="field"><label for="gClient">Client</label><input id="gClient" value="${esc(g?g.client:"")}" placeholder="Optional"></div>
    <div class="field"><label for="gDate">Date</label><input id="gDate" type="date" value="${esc(g?g.date:"")}"></div>
    <div class="field"><label>Kits</label><div class="chips" id="kitPick">${kits.length?kits.map(k=>`<button type="button" class="chip${sel.has(k.id)?" on":""}" data-kit="${esc(k.id)}">${esc(k.name)}<span style="opacity:.6;font-weight:600;">${(k.itemIds||[]).filter(i=>S.items[i]).length}</span></button>`).join(""):`<span class="small">No kits yet. Build some on the Kits tab.</span>`}</div></div></div>`;
  sheet(g?"Edit gig":"New gig",body,async()=>{
    const name=val("gName"); if(!name){ toast("Give it a name."); return false; }
    const picked=[]; $$("#kitPick .chip.on").forEach(c=>picked.push(c.dataset.kit));
    const rec={id:g?g.id:uid(),name,client:val("gClient"),date:val("gDate"),kitIds:picked,extraItemIds:(g&&g.extraItemIds)||[],packed:(g&&g.packed)||{},loaded:(g&&g.loaded)||{},notes:(g&&g.notes)||[],createdAt:(g&&g.createdAt)||now(),completedAt:(g&&g.completedAt)||null};
    await Store.save("gigs",rec); if(!g){ Pack.wasFull=null; go("gig",rec.id); } else render();
  },g?"Save":"Create",s=>{ $("#kitPick",s).addEventListener("click",e=>{ const c=e.target.closest("[data-kit]"); if(c) c.classList.toggle("on"); }); });
}
function sheetAddOne(g){
  const have=new Set(itemsOf(g).map(e=>e.item.id)); const sel=new Set();
  const body=`<div class="fields"><p class="lede" style="margin:0;">The slider. The macro tube. The thing you thought of on Tuesday. It goes to the top of the list.</p>
    <div class="search" style="margin:0;">${searchSvg}<input id="kQ" placeholder="Find gear" type="search" autocomplete="off"></div>
    <div id="kList">${pickList(sel,i=>!have.has(i.id),"Everything you own is already on this shoot.")}</div><p class="note"><span id="kCount">0</span> selected</p></div>`;
  sheet("Add to this shoot",body,async()=>{ if(!sel.size) return true; await Store.save("gigs",Object.assign({},g,{extraItemIds:(g.extraItemIds||[]).concat(Array.from(sel))})); render(); toast("Added "+sel.size+" to the shoot."); },"Add",s=>wirePick(s,sel));
}
function sheetNote(g){
  sheet("Add a note",`<div class="field"><label for="nText">Note</label><textarea id="nText" rows="3" placeholder="Try a low slider move through the doorway"></textarea></div>`,async()=>{ const t=val("nText"); if(!t) return false; const at=new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"}); await Store.save("gigs",Object.assign({},g,{notes:(g.notes||[]).concat([{id:uid(),text:t,at,itemIds:[]}])})); render(); },"Add");
}

/* ============================================================
   Self test
   ============================================================ */
async function runSelfTest(){
  if(!confirm("This clears the database as part of the test. Export a backup first if you have real data. Continue?")) return;
  try{
    const png="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
    const id="test_"+Date.now();
    await DB.put("containers",{id:"test_case",name:"Test case",color:"#8b9296",order:99});
    await DB.put("items",{id,name:"Test item",category:"misc",containerId:"test_case",photoId:id,note:"",archived:false,createdAt:now()});
    await DB.put("photos",{id,blob:await dataURLToBlob(png)});
    const snap=await Backup.export(); await DB.clearAll();
    if((await DB.counts()).items!==0) throw new Error("clear did not empty the database");
    await Backup.restore(snap);
    const item=await DB.get("items",id), photo=await DB.get("photos",id);
    if(!item||item.name!=="Test item") throw new Error("item did not come back");
    if(!photo||!photo.blob||photo.blob.size<1) throw new Error("photo did not come back");
    await DB.del("items",id); await DB.del("photos",id); await DB.del("containers","test_case");
    await Store.load(); await Settings.refresh(); render();
    toast("Round trip passed. Photo came back as "+photo.blob.size+" bytes.");
  }catch(e){ toast("FAILED: "+e.message,true); }
}

/* ============================================================
   Swipe between tabs
   ============================================================ */
(function(){
  const main=document.getElementById("main"); let x0=0,y0=0,dx=0,lock=null,W=0;
  main.addEventListener("touchstart",e=>{ if(document.getElementById("sheet")||route.view==="first-run"||TAB_ORDER.indexOf(route.view)<0||e.touches.length!==1){ lock="x"; return; } const t=e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; lock=null; W=window.innerWidth; main.style.transition="none"; },{passive:true});
  main.addEventListener("touchmove",e=>{ if(lock==="x"||lock==="v") return; const t=e.touches[0]; const mx=t.clientX-x0, my=t.clientY-y0;
    if(lock===null){ if(Math.abs(mx)<10&&Math.abs(my)<10) return; if(e.target.closest(".hrow, .gauges")){ lock="v"; return; } lock=Math.abs(mx)>Math.abs(my)*1.3?"h":"v"; if(lock==="v") return; }
    const i=TAB_ORDER.indexOf(route.view); const can=(mx<0&&i<TAB_ORDER.length-1)||(mx>0&&i>0); dx=can?mx*0.55:mx*0.16; e.preventDefault();
    main.style.transform="translateX("+dx.toFixed(1)+"px)"; main.style.opacity=String(1-Math.min(.4,Math.abs(dx)/(W*0.8))); },{passive:false});
  function end(){ if(lock!=="h"){ lock=null; return; } lock=null; const i=TAB_ORDER.indexOf(route.view); const sign=dx<0?1:-1; const target=TAB_ORDER[i+sign];
    if(Math.abs(dx)>52&&target&&!reduced()){ main.style.transition="transform .15s var(--out),opacity .15s var(--out)"; main.style.transform="translateX("+(-sign*W*0.28)+"px)"; main.style.opacity="0";
      setTimeout(()=>{ skipVT=true; location.hash="#/"+target; render(); window.scrollTo(0,0); main.style.transition="none"; main.style.transform="translateX("+(sign*48)+"px)"; main.style.opacity="0";
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ main.style.transition="transform .32s var(--ease),opacity .32s var(--ease)"; main.style.transform=""; main.style.opacity=""; })); },140); }
    else if(Math.abs(dx)>52&&target){ location.hash="#/"+target; main.style.transform=""; main.style.opacity=""; }
    else { main.style.transition="transform .38s var(--spring),opacity .2s"; main.style.transform=""; main.style.opacity=""; } }
  main.addEventListener("touchend",end); main.addEventListener("touchcancel",end);
})();

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go,g.dataset.arg); return; }
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, id=t.dataset.id; const gig=route.view==="gig"?S.gigs[route.arg]:null;

  if(act==="fr-start"){ FirstRun.step=1; render({vt:"fade"}); return; }
  if(act==="fr-skip"){ await Store.setMeta("onboarded",true); go("home"); return; }
  if(act==="fr-next"){ const v=val("frKit"); if(!v){ toast("Give the kit a name."); return; } FirstRun.kitName=v; FirstRun.step=2; render({vt:"fade"}); return; }
  if(act==="fr-add"){ FirstRun.add(); return; }
  if(act==="fr-edit"){ sheetItem(FirstRun.items[+t.dataset.i],{firstRun:true}); return; }
  if(act==="fr-save"){ await FirstRun.save(); return; }

  if(act==="item-new") return sheetItem(null);
  if(act==="item-edit") return sheetItem(S.items[id]);
  if(act==="case-new") return sheetCase(null);
  if(act==="case-edit") return sheetCase(S.containers[id]);
  if(act==="kit-new") return sheetKit(null);
  if(act==="kit-edit") return sheetKit(S.kits[id]);
  if(act==="gig-new") return sheetGig(null);
  if(act==="gig-edit") return sheetGig(gig);
  if(act==="gig-del"){ if(!gig) return; if(t.dataset.armed){ await Store.remove("gigs",gig.id); go("gigs"); return; } t.dataset.armed="1"; t.textContent="Tap again to delete"; return; }
  if(act==="addone") return sheetAddOne(gig);
  if(act==="note-new") return sheetNote(gig);
  if(act==="note-del"){ const arr=(gig.notes||[]).slice(); arr.splice(+t.dataset.i,1); await Store.save("gigs",Object.assign({},gig,{notes:arr})); render(); return; }

  if(act==="tick"){ if(!gig) return; const p=Object.assign({},gig.packed||{}); p[id]=!p[id]; if(!p[id]) delete p[id];
    t.classList.toggle("done",!!p[id]);
    await Store.save("gigs",Object.assign({},gig,{packed:p}));
    if(!Pack.refresh()) setTimeout(()=>render({still:true}),260); return; }
  if(act==="load"){ if(!gig) return; const l=Object.assign({},gig.loaded||{}); l[id]=!l[id]; if(!l[id]) delete l[id]; t.classList.toggle("done",!!l[id]);
    const rec=Object.assign({},gig,{loaded:l}); const pr=progress(rec); rec.completedAt=pr.loaded?now():null; await Store.save("gigs",rec);
    if(!Pack.refresh()) setTimeout(()=>render({still:true}),260); return; }
  if(act==="expand"){ const grp=t.closest(".grp"); if(!grp) return; const body=grp.querySelector(".body"); grp.classList.remove("collapsed"); body.style.maxHeight=body.scrollHeight+"px"; t.remove(); setTimeout(()=>{ body.style.maxHeight=""; },500); return; }
  if(act==="jump"){ const el=document.getElementById("grp-"+id); if(el){ el.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"}); } return; }

  if(act==="export"){ try{ toast("Saved "+await Backup.download()); }catch(err){ toast("Export failed: "+err.message,true); } return; }
  if(act==="import"){ $("#importFile").click(); return; }
  if(act==="reload"){ location.reload(); return; }
  if(act==="selftest"){ runSelfTest(); return; }
  if(act==="seed"){ if(!confirm("Add sample gear, cases, kits and an example gig? It mixes in with anything you already have.")) return; await Seed.load(); render(); toast("Sample gear loaded."); return; }
  if(act==="firstrun"){ await Store.setMeta("onboarded",false); FirstRun.step=0; go("first-run"); return; }
  if(act==="wipe"){ if(!confirm("Delete everything on this phone? This cannot be undone.")) return; if(!confirm("Really sure? Export a backup first if you might want it back.")) return; await DB.clearAll(); await Store.load(); Photos.reset(); FirstRun.step=0; render(); toast("Everything deleted."); return; }
});
document.addEventListener("change",async e=>{ if(e.target.id==="importFile"){ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return; if(!confirm("Restoring replaces everything currently in the app. Continue?")) return; try{ await Backup.restore(JSON.parse(await f.text())); await Settings.refresh(); render(); toast("Restored from backup."); }catch(err){ toast(err.message||"That backup couldn't be read.",true); } } });
document.addEventListener("click",e=>{ const b=e.target.closest("#themeSeg [data-t]"); if(b){ Theme.set(b.dataset.t); render(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
window.addEventListener("online",()=>render()); window.addEventListener("offline",()=>render());

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  try{ await DB.open(); }
  catch(e){ $("#main").innerHTML='<div class="card"><h3>Storage unavailable</h3><p class="note">This browser blocked local storage, so nothing can be saved. Private browsing is the usual cause.</p></div>'; return; }
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  await Store.load(); await Settings.refresh();
  if(new URLSearchParams(location.search).get("seed")==="1"&&Store.list("items").length===0) await Seed.load();
  render(); initSW();
})();
